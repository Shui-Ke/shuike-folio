<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Shuike Look — 低模 + 特效实验</title>
        <link rel="stylesheet" href="./style.css">
        <script type="importmap">
            {
                "imports": {
                    "three": "./lib/three.webgpu.js",
                    "three/webgpu": "./lib/three.webgpu.js",
                    "three/tsl": "./lib/three.tsl.js",
                    "three/addons/": "./lib/addons/"
                }
            }
        </script>
    </head>
    <body>
        <canvas class="scene"></canvas>

        <header class="panel">
            <div class="eyebrow">SHUIKE LOOK · 效果拆解</div>
            <h1>低模 + 光照 + 粒子</h1>
            <p>树干是 6 边圆柱，树冠是二十面体，房子和箱子都是方块。让它看起来成立的，是下面这几层，而不是模型本身。</p>

            <div class="row">
                <span class="label">系统</span>
                <button data-toggle="grass" class="chip is-on">草 G</button>
                <button data-toggle="foliage" class="chip is-on">树冠 F</button>
                <button data-toggle="rain" class="chip is-on">雨 R</button>
                <button data-toggle="leaves" class="chip is-on">落叶 L</button>
            </div>

            <div class="row">
                <span class="label">配色</span>
                <button data-preset="day" class="chip is-on">白天 1</button>
                <button data-preset="dusk" class="chip">黄昏 2</button>
                <button data-preset="night" class="chip">夜晚 3</button>
            </div>

            <div class="row hint">
                拖动旋转 · 滚轮缩放 · 按 G / F / R / L 对比开关前后的差别 · E 炸一下落叶
            </div>

            <div class="credit">基于 Bruno Simon 的 folio-2025（MIT）重写</div>
        </header>

        <script type="module" src="./main.js"></script>
    </body>
</html>

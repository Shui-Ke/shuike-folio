<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>荒原 · 场景编辑器</title></head>
<body>
<header>
 <a class="brand" href="./"><span class="brand-icon">▧</span> 荒原 <span class="brand-sub">场景编辑器</span></a>
 <input id="scene-name" aria-label="场景名称" value="峡谷营地" maxlength="64">
 <span id="save-state">正在载入素材</span>
 <div class="header-actions"><button id="new-map">新建地图</button><button id="open-scene">打开</button><button id="import-scene">导入布局</button><button id="export-scene">导出布局</button><button id="save-scene" class="primary">保存场景</button></div>
</header>
<main>
 <aside class="library">
  <div class="panel-title"><h2>素材库</h2><span id="asset-count"></span></div>
  <input id="search" type="search" placeholder="搜索模型…" aria-label="搜索素材">
  <nav id="categories" aria-label="素材类别"></nav>
  <div id="assets" class="assets"></div>
  <div class="library-foot">拖入场景，或选中素材后点击地面</div>
 </aside>
 <section id="viewport" aria-label="三维场景">
  <div class="toolbar">
   <div class="tool-group"><button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Shift+Z">↷</button></div>
   <div class="tool-group"><button data-mode="translate" class="active" title="移动 W">移动</button><button data-mode="rotate" title="旋转 E">旋转</button><button data-mode="scale" title="缩放 R">缩放</button></div>
   <div class="tool-group"><button id="frame-all" title="查看全景">全景</button><button id="frame-selected" title="聚焦选中物件 F">聚焦</button></div>
   <label class="snap"><input id="snap" type="checkbox"> 网格吸附</label>
  </div>
  <div class="terrain-control"><label for="terrain">底图</label><select id="terrain"><option value="bruno">Bruno 原版完整地图</option><option value="custom">自建地形</option><option value="canyon">嶙峋峡谷与朱红大桥</option><option value="flat">空白地面</option></select><button id="play-scene">驾车试玩</button></div>
  <details id="terrain-tools" hidden open><summary>地形与环境笔刷</summary>
   <select id="brush-mode" aria-label="笔刷工具"><option value="select">选择 / 环绕</option><option value="raise">升高</option><option value="lower">降低</option><option value="smooth">平滑</option><option value="flatten">平整到指定高度</option><option value="grass">种草</option><option value="eraseGrass">擦除草地</option><option value="river">开挖河流 / 湖泊</option><option value="eraseWater">擦除水面</option></select>
   <label>半径（米）<input id="brush-radius" type="number" min="2" max="64" step="1" value="12"></label>
   <label>力度<input id="brush-strength" type="number" min="0.1" max="30" step="0.5" value="5"></label>
   <label>平整高度（米）<input id="brush-level" type="number" min="-100" max="100" step="1" value="0"></label>
   <label>水位（米）<input id="water-level" type="number" min="-80" max="80" step="0.5" value="-0.3"></label>
   <label>河床深度（米）<input id="river-depth" type="number" min="0.5" max="30" step="0.5" value="3"></label>
   <small>左键涂抹 · Shift＋左键 / 右键平移<br>滚轮缩放 · 笔刷修改可撤销。</small>
  </details>
  <div id="placement" hidden><span></span><button id="cancel-placement">取消 Esc</button></div>
  <div class="viewport-foot"><span>左键环绕 · Shift＋左键 / 右键平移 · 滚轮缩放</span><span id="object-count">0 个物件</span></div>
  <div id="loading" class="loading">正在载入峡谷…</div>
 </section>
 <aside class="inspector">
  <div class="panel-title"><h2>物件属性</h2></div>
  <div id="empty-selection"><span class="selection-icon">⌖</span><p>选择场景中的物件</p><small>查看位置、旋转与缩放</small></div>
  <div id="properties" hidden>
   <label class="field-label" for="object-name">名称</label><input id="object-name" maxlength="120">
   <p id="asset-name"></p>
   <div id="transform-fields"></div>
   <div class="property-actions"><button id="ground">贴合地形</button><button id="duplicate">复制</button><button id="delete" class="danger">删除</button></div>
   <div class="collision-note"><span class="status-dot"></span><div>正式碰撞待配置<small>试玩使用临时模型碰撞；保存场景后，由助手进一步简化配置。</small></div></div>
  </div>
  <div class="scene-list-head"><h2>场景物件</h2><span id="list-count">0</span></div>
  <div id="object-list"></div>
 </aside>
</main>
<div id="toast" role="status" hidden></div>
<dialog id="open-dialog"><div class="dialog-head"><h2>打开场景</h2><button id="close-dialog">关闭</button></div><p>已保存到本地项目的场景</p><div id="saved-list"></div></dialog>
<input id="layout-file" type="file" accept=".json,application/json" hidden>
<dialog id="new-map-dialog"><div class="dialog-head"><h2>从零制作地图</h2><button id="close-new-map">关闭</button></div><p>创建一张空白地形，用笔刷塑造山丘、谷地和河道。</p><label>地图名称<input id="new-map-name" value="我的地图" maxlength="64"></label><label>地图边长<select id="new-map-size"><option value="128">128 米 · 精细</option><option value="192" selected>192 米 · 标准</option><option value="384">384 米 · 宽阔</option></select></label><button id="create-map" class="primary">创建空白地图</button></dialog>
<script type="module" src="./main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <meta name="theme-color" content="#111713">
        <title>Driving Games</title>
        <link rel="icon" href="./favicon.ico" sizes="any">
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
        <link rel="icon" type="image/png" sizes="180x180" href="./favicon-180.png">
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Driving Games">
        <meta property="og:description" content="Low-poly car battle on a procedural map  ·  WebGPU / three.js">
        <meta property="og:image" content="https://shui-ke.github.io/shuike-folio/og-cover.png">
        <meta property="og:url" content="https://shui-ke.github.io/shuike-folio/">
        <meta name="twitter:card" content="summary_large_image">
        <link rel="stylesheet" href="./style/index.styl">
        <link rel="stylesheet" href="./style/clean.css">
        <link rel="stylesheet" href="./style/esc-menu.css">
        <link rel="stylesheet" href="./style/setup.css">
        <link rel="stylesheet" href="./style/match.css">
        <link rel="stylesheet" href="./style/hud.css">
    </head>
    <body>
        <div class="game">
            <canvas class="js-canvas"></canvas>

            <button class="clean-menu-trigger" type="button" data-esc-open>
                <span>Esc</span> Settings
            </button>

            <div class="clean-hud">
                <div class="clean-hud__eyebrow">LANDSCAPE TEST</div>
                <div class="clean-hud__controls">
                    <span><b>W A S D</b> drive</span>
                    <span><b>Shift</b> boost</span>
                    <span><b>Space</b> jump</span>
                    <span><b>Wheel</b> zoom</span>
                    <span><b>R</b> respawn</span>
                    <span><b>Esc</b> settings</span>
                </div>
            </div>

            <div class="js-touch-buttons touch-buttons">
                <div class="js-overlay overlay"></div>
                <div class="list"></div>
            </div>
        </div>

        <script type="module" src="./index.js"></script>
    </body>
</html>

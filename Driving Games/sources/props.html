<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Games · Props preview</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #e9ddc6; color: #352b42; font-family: "Microsoft YaHei", sans-serif; }
        main { max-width: 1440px; margin: auto; padding: 30px 42px; }
        header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 24px; }
        .eyebrow { font-size: 11px; letter-spacing: 4px; font-weight: 800; color: #996b4e; }
        h1 { font-size: 30px; margin: 9px 0 0; letter-spacing: 2px; }
        header p { font-size: 12px; color: #796c68; }
        .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
        .card { grid-column: span 3; border: 1px solid #cbbca5; border-radius: 14px; background: #f4ead6; overflow: hidden; }
        .card:nth-child(n+5) { grid-column: span 4; }
        .label { display: flex; align-items: center; gap: 12px; padding: 17px 20px 0; }
        .number { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 7px; background: #352b42; color: #fff0ce; font: bold 11px monospace; }
        h2 { font-size: 16px; margin: 0; }
        .viewer { height: 273px; position: relative; touch-action: none; }
        canvas { width: 100%; height: 100%; display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }
        .caption { display: flex; justify-content: space-between; padding: 0 20px 15px; font-size: 11px; color: #8c796a; letter-spacing: 1px; }
        .swatches { display: flex; gap: 5px; }
        .swatches i { width: 10px; height: 10px; border-radius: 50%; display: block; }
        footer { padding-top: 18px; color: #8c796a; font-size: 11px; letter-spacing: 2px; }
        @media(max-width: 750px) { main { padding: 20px; } header { display: block; } .card, .card:nth-child(n+5) { grid-column: span 12; } }
    </style>
</head>
<body>
<main>
    <header><div><div class="eyebrow">BUMPER ARENA / PROPS 01</div><h1>Combat props · First batch</h1></div><p>Drag to rotate · Scroll to zoom</p></header>
    <section class="grid" aria-label="Seven prop models"></section>
    <footer>Caltrop / Missile / Jetpack / Shield / POWER+ / JUMP×2 / SPEED+</footer>
</main>
<script type="module" src="/props-preview.js"></script>
</body>
</html>
